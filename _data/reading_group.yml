# Content of the reading-group page at /reading-group/.
# Edit the text here. The page title and markup are in _pages/reading-group.html.

# Organizational details, shown as a block at the top of the page. Keep each
# value in quotes; an empty one ("") is left out of the page.
# This file is public: a Zoom link entered here is visible to everyone.
organization:
  organizer: "Davit Gogolashvili"
  group: "WIAS Research Group 6"
  when: "Monday, November 23, 14:00"
  where: "Room 406 (in person)"
  format: "Each session is led by a moderator and lasts one hour."
  # The three texts below allow Markdown: **bold**, and a pasted web address
  # becomes a link.
  # A paragraph below the lines above, for example a Zoom link if a meeting
  # is online.
  details: ""
  # Shown as a highlighted note, for example "**Attention:** ...".
  notice: ""
  # An optional closing line, for example how to get in touch.
  contact: ""

# The sessions of the reading group, in the order they take place; the page
# numbers them. To add a session, copy one block starting with "- title:".
# A session's venue, url, date, moderator and description are optional; a
# date is worth giving while the session is still ahead.
# Sessions can be grouped: copy a whole block starting with "- name:" and
# give each group a name (and, optionally, a description).
program:
  title: Sessions
  tag: # small label next to the heading, for example Tentative; empty for none
  sections:
    - papers:
        - title: Attention Is All You Need
          authors: Vaswani et al.
          venue: NeurIPS 2017
          url: https://arxiv.org/abs/1706.03762
          moderator: Davit
          description: >-
            The foundational architecture: attention, positional encodings, and
            transformer blocks.

        - title: Improving Language Understanding by Generative Pre-Training
          authors: Radford, Narasimhan, Salimans & Sutskever
          venue: OpenAI, 2018
          url: https://cdn.openai.com/research-covers/language-unsupervised/language_understanding_paper.pdf
          date: "Monday, November 23"
          moderator: Oleg

suggestions:
  invitation: >-
    Which paper should we read next? Suggest a paper relevant to the
    statistical theory of transformers.
  # Address of the Google Sheet script that stores the suggestions; it ends in
  # /exec (setup: "Paper suggestions" in README.md). While this is empty, the
  # page shows no form and says that suggestions are not open yet.
  endpoint: "https://script.google.com/macros/s/AKfycbwxCsHAgjojJgF-BLrL2UGQT50Vg69FTXXPKlzYcXSErB8zHeDjgyBp8Jb4kxcQ9Lb5/exec"
