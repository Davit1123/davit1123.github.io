program:
  title: Initial reading program
  tag: Tentative # small label next to the heading; leave empty to remove it
  papers:
    - title: Attention Is All You Need
      authors: Vaswani et al.
      venue: NeurIPS 2017
      url: https://arxiv.org/abs/1706.03762
      description: >-
        The foundational transformer paper. Our starting point for understanding
        self-attention, multi-head attention, positional encodings, and the
        overall architecture.

    - title: A Mathematical Perspective on Transformers
      authors: Geshkovski, Letrouit, Polyanskiy, and Rigollet
      venue: Bulletin of the AMS 2025; preprint 2023
      url: https://arxiv.org/abs/2312.10794
      description: >-
        A mathematical introduction to transformers through interacting particle
        systems and attention dynamics. We will initially focus on the
        introductory and modeling material.

    - title: "What Can Transformers Learn In-Context? A Case Study of Simple Function Classes"
      authors: Garg, Tsipras, Liang, and Valiant
      venue: NeurIPS 2022
      url: https://arxiv.org/abs/2208.01066
      description: >-
        An accessible experimental introduction to in-context learning through
        regression tasks and comparisons with classical estimators.

    - title: Transformers Learn In-Context by Gradient Descent
      authors: von Oswald et al.
      venue: ICML 2023
      url: https://proceedings.mlr.press/v202/von-oswald23a.html
      description: >-
        Shows how a linear attention layer can implement a gradient step for
        regression, connecting transformer computations with familiar learning
        algorithms.

    - title: "Transformers as Statisticians: Provable In-Context Learning with In-Context Algorithm Selection"
      authors: Bai, Chen, Wang, Xiong, and Mei
      venue: NeurIPS 2023
      url: https://arxiv.org/abs/2306.04637
      description: >-
        Develops statistical theory for transformers implementing classical
        estimators and selecting algorithms adaptively from the context.

suggestions:
  invitation: >-
    Which paper should we read next? Suggest a paper relevant to the
    statistical theory of transformers.
