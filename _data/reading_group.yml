# Content of the reading-group page at /reading-group/.
# Edit the text here. The page title and markup are in _pages/reading-group.html.

organizer: Davit Gogolashvili
group: WIAS Research Group 6

# Introductory text. Markdown (links, emphasis) is allowed.
description: >-
  This reading group explores the mathematical and statistical foundations of
  transformers. We will start with the architecture and basic concepts, then
  study expressivity, in-context learning, generalization, and statistical
  estimation. Participants are encouraged to suggest papers and help shape the
  reading program.

# Meetings. Every field is optional free text, shown as written. Keep values in
# quotes (an unquoted time such as 14:00 is misread). Empty fields are left out,
# and a meeting with nothing filled in is not shown at all. Copy the block to
# list more meetings.
# This file is public: a Zoom link entered here is visible to everyone.
